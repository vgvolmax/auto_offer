name: Temporary runtime export
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  export-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build runtime archive
        run: tar -czf /tmp/auto_offer-node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: auto-offer-node-modules
          path: /tmp/auto_offer-node_modules.tar.gz
          if-no-files-found: error
          retention-days: 1
