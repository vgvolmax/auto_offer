name: Lockfile bootstrap

on:
  push:
    branches:
      - codex-3v0ly9
    paths:
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex-3v0ly9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json was not updated" >&2
            exit 1
          fi
          rm .github/workflows/lockfile-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/lockfile-bootstrap.yml
          git commit -m "chore: sync frontend dependency lockfile"
          git push origin HEAD:codex-3v0ly9
