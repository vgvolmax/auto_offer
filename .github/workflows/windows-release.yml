name: Windows portable release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - start.bat
      - stop.bat
      - scripts/launcher/**
      - scripts/release/**
      - .github/workflows/windows-release.yml
      - .gitattributes
      - package.json
      - package-lock.json
      - app/**
      - release-manifest*.json
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-and-e2e:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:app
      - run: npm run test:app
      - run: npm run test:pilot
      - run: npm run app:build
      - run: npm test
      - name: Launcher unit tests
        run: python -m unittest discover -s scripts/launcher/tests -p "test_*.py" -v
      - name: Release contract tests
        run: python -m unittest discover -s scripts/release/tests -p "test_*.py" -v
      - name: Build staging package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $commit = '${{ github.event.pull_request.head.sha }}'
          if (-not $commit) { $commit = '${{ github.sha }}' }
          $short = $commit.Substring(0,7)
          $name = "Auto-Offer-$version-$short-windows-x64"
          $timestamp = [DateTime]::UtcNow.ToString('o')
          python scripts/release/build_windows_release.py --app dist/app --output "release-staging/$name" --source-commit $commit --build-timestamp $timestamp
          python scripts/release/verify_windows_release.py "release-staging/$name"
          Compress-Archive -LiteralPath "release-staging/$name" -DestinationPath "$name.zip"
          "RELEASE_NAME=$name" >> $env:GITHUB_ENV
      - name: Extract exact user ZIP into Unicode path
        shell: pwsh
        run: |
          $target = 'C:\CI Work\Тест Auto Offer\auto_offer'
          New-Item -ItemType Directory -Force $target | Out-Null
          Expand-Archive "$env:GITHUB_WORKSPACE\$env:RELEASE_NAME.zip" $target
          $root = Join-Path $target $env:RELEASE_NAME
          python "$env:GITHUB_WORKSPACE\scripts\release\verify_windows_release.py" $root
          if (Get-ChildItem $root -Recurse | Where-Object { $_.Name -in 'node.exe','npm','npm.cmd','node_modules' }) { throw 'Node/npm leaked into package' }
          "E2E_ROOT=$root" >> $env:GITHUB_ENV
      - name: Malformed bootstrap manifest fails before installation
        shell: pwsh
        working-directory: C:\Windows\Temp
        run: |
          $manifestPath = "$env:E2E_ROOT\scripts\launcher\runtime-manifest.json"
          $original = [IO.File]::ReadAllBytes($manifestPath)
          try {
            $bad = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $bad.runtime_paths = $false
            [IO.File]::WriteAllText($manifestPath, ($bad | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
            & "$env:E2E_ROOT\start.bat" --no-browser
            if ($LASTEXITCODE -eq 0) { throw 'malformed bootstrap manifest was accepted' }
            if (Test-Path -LiteralPath "$env:E2E_ROOT\.runtime\python") { throw 'malformed manifest installed a runtime before rejection' }
            if (Test-Path -LiteralPath "$env:E2E_ROOT\.runtime\python-download.part") { throw 'malformed manifest started a download before rejection' }
          } finally {
            [IO.File]::WriteAllBytes($manifestPath, $original)
          }

      - name: BAT-level first start, concurrency, health and stop
        shell: pwsh
        working-directory: C:\Windows\Temp
        run: |
          $out1="$env:RUNNER_TEMP\start1.out"; $out2="$env:RUNNER_TEMP\start2.out"
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $err1="$env:RUNNER_TEMP\start1.err"; $err2="$env:RUNNER_TEMP\start2.err"
          $p1=Start-Process -FilePath "$env:E2E_ROOT\start.bat" -ArgumentList '--no-browser' -RedirectStandardOutput $out1 -RedirectStandardError $err1 -PassThru
          Start-Sleep -Milliseconds 300
          $p2=Start-Process -FilePath "$env:E2E_ROOT\start.bat" -ArgumentList '--no-browser' -RedirectStandardOutput $out2 -RedirectStandardError $err2 -PassThru
          $p1.WaitForExit(); $p2.WaitForExit()
          if ($p1.ExitCode -ne 0 -or $p2.ExitCode -ne 0) {
            @($out1,$out2,$err1,$err2,"$env:E2E_ROOT\.runtime\logs\launcher.log","$env:E2E_ROOT\.runtime\logs\server.log") | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-Content -LiteralPath $_ | Select-String -NotMatch 'shutdown_token|X-Auto-Offer-Shutdown|Authorization|Cookie' }
            throw "starts failed: $($p1.ExitCode),$($p2.ExitCode)"
          }
          if ((Get-ChildItem "$env:E2E_ROOT\.runtime" -Force | Where-Object { $_.Name -eq 'python-download.part' -or $_.Name -like 'python-install-*' }).Count -ne 0) { throw 'runtime installation left temporary files' }
          $health=Invoke-RestMethod http://127.0.0.1:8765/__auto_offer_health
          if ($health.app_identity -ne 'auto-offer' -or $health.pid -le 0 -or -not $health.instance_id -or -not $health.release_fingerprint) { throw 'health identity mismatch' }
          $state=Get-Content "$env:E2E_ROOT\.runtime\server.json" -Raw | ConvertFrom-Json
          if ($state.pid -ne $health.pid -or $state.instance_id -ne $health.instance_id) { throw 'server state mismatch' }
          $serverProcess=Get-Process -Id $health.pid -ErrorAction Stop
          if ($serverProcess.HasExited) { throw 'health PID does not belong to a running process' }
          $serverCommands=@(Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq $health.pid })
          if ($serverCommands.Count -ne 1 -or $serverCommands[0].CommandLine -notmatch 'launcher\.py.+serve') { throw 'health PID is not the server process' }
          if ($serverCommands[0].CommandLine -match 'shutdown|token') { throw 'shutdown token leaked into process arguments' }
          $pythonServers=@(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match [regex]::Escape($env:E2E_ROOT) -and $_.CommandLine -match 'launcher\.py.+serve' })
          if ($pythonServers.Count -ne 1) { throw "expected one server process, found $($pythonServers.Count)" }
          $rootResponse=Invoke-WebRequest http://127.0.0.1:8765/
          if ($rootResponse.StatusCode -ne 200) { throw 'root failed' }
          $refs=[regex]::Matches($rootResponse.Content,'(?:src|href)=["'']([^"''#]+)["'']') | ForEach-Object { $_.Groups[1].Value }
          foreach ($ref in $refs) { if ((Invoke-WebRequest ([Uri]::new([Uri]'http://127.0.0.1:8765/',$ref))).StatusCode -ne 200) { throw "asset failed: $ref" } }
          foreach ($log in @("$env:E2E_ROOT\.runtime\logs\launcher.log","$env:E2E_ROOT\.runtime\logs\server.log")) {
            if ((Test-Path $log) -and (Get-Content $log -Raw) -match [regex]::Escape($state.shutdown_token)) { throw 'shutdown token leaked into logs' }
          }
          & "$env:E2E_ROOT\stop.bat"; if ($LASTEXITCODE) { throw 'stop failed' }
          Start-Sleep -Milliseconds 300
          if (Get-Process -Id $health.pid -ErrorAction SilentlyContinue) { throw 'server process survived stop' }
          if (Test-Path "$env:E2E_ROOT\.runtime\server.json") { throw 'server state survived stop' }
      - name: Damaged and unexpected runtime files are repaired
        shell: pwsh
        working-directory: C:\Windows\Temp
        run: |
          & "$env:E2E_ROOT\start.bat" --no-browser
          if ($LASTEXITCODE) { throw 'pre-repair server start failed' }
          $runningBefore = Invoke-RestMethod http://127.0.0.1:8765/__auto_offer_health
          $receiptPath = "$env:E2E_ROOT\.runtime\python\install-receipt.json"
          $before = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($before.schema_version -ne 2 -or @($before.files).Count -eq 0) { throw 'runtime receipt has no verified file inventory' }
          $target = @($before.files | Where-Object { $_.path -ne 'python.exe' -and $_.path -match '\.(txt|cat|pth)$' } | Select-Object -First 1)
          if ($target.Count -eq 0) { $target = @($before.files | Where-Object { $_.path -ne 'python.exe' } | Select-Object -First 1) }
          if ($target.Count -ne 1) { throw 'receipt has no file available for tamper test' }
          $targetPath = Join-Path "$env:E2E_ROOT\.runtime\python" $target[0].path
          $installedAt = [string]$before.installed_at
          Add-Content -LiteralPath $targetPath -Value 'intentional CI corruption'
          $unexpected = "$env:E2E_ROOT\.runtime\python\unexpected-runtime-file.txt"
          Set-Content -LiteralPath $unexpected -Value 'not part of the pinned runtime'
          & "$env:E2E_ROOT\start.bat" --no-browser
          if ($LASTEXITCODE) { throw 'runtime repair start failed' }
          $after = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ([string]$after.installed_at -eq $installedAt) { throw 'damaged runtime was reused without reinstall' }
          if (Test-Path -LiteralPath $unexpected) { throw 'unexpected runtime file survived repair' }
          $restored = @($after.files | Where-Object { $_.path -eq $target[0].path })
          if ($restored.Count -ne 1) { throw 'repaired receipt lost the tampered file' }
          $actualHash = (Get-FileHash -LiteralPath $targetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $restored[0].sha256 -or (Get-Item -LiteralPath $targetPath).Length -ne $restored[0].size) { throw 'tampered runtime file was not restored' }
          $runningAfter = Invoke-RestMethod http://127.0.0.1:8765/__auto_offer_health
          if ($runningAfter.pid -eq $runningBefore.pid) { throw 'runtime repair reused the process that still owned the damaged runtime' }
          & "$env:E2E_ROOT\stop.bat"
          if ($LASTEXITCODE) { throw 'stop after runtime repair failed' }

      - name: Interrupted publication recovers offline
        shell: pwsh
        working-directory: C:\Windows\Temp
        run: |
          $runtime = "$env:E2E_ROOT\.runtime"
          $active = Join-Path $runtime 'python'
          $previous = Join-Path $runtime 'python.previous'
          if (Test-Path -LiteralPath $previous) { throw 'previous runtime survived a successful launch' }
          $receiptHash = (Get-FileHash -LiteralPath (Join-Path $active 'install-receipt.json') -Algorithm SHA256).Hash
          Move-Item -LiteralPath $active -Destination $previous
          $oldHttps = $env:HTTPS_PROXY
          $oldHttp = $env:HTTP_PROXY
          $oldNoProxy = $env:NO_PROXY
          try {
            $env:HTTPS_PROXY = 'http://127.0.0.1:9'
            $env:HTTP_PROXY = 'http://127.0.0.1:9'
            $env:NO_PROXY = '127.0.0.1,localhost'
            & "$env:E2E_ROOT\start.bat" --no-browser
            if ($LASTEXITCODE) { throw 'offline recovery start failed' }
          } finally {
            $env:HTTPS_PROXY = $oldHttps
            $env:HTTP_PROXY = $oldHttp
            $env:NO_PROXY = $oldNoProxy
          }
          if (-not (Test-Path -LiteralPath $active)) { throw 'previous runtime was not restored' }
          if (Test-Path -LiteralPath $previous) { throw 'previous runtime was not finalized after successful launch' }
          if (Test-Path -LiteralPath (Join-Path $runtime 'python-download.part')) { throw 'offline recovery attempted a download' }
          if ((Get-FileHash -LiteralPath (Join-Path $active 'install-receipt.json') -Algorithm SHA256).Hash -ne $receiptHash) { throw 'offline recovery changed the verified receipt' }
          $health = Invoke-RestMethod http://127.0.0.1:8765/__auto_offer_health
          Invoke-WebRequest http://127.0.0.1:8765/ | Out-Null
          & "$env:E2E_ROOT\stop.bat"
          if ($LASTEXITCODE) { throw 'stop after offline recovery failed' }
          Start-Sleep -Milliseconds 300
          if (Get-Process -Id $health.pid -ErrorAction SilentlyContinue) { throw 'recovered server survived stop' }

      - name: Offline repeat start and stop
        shell: pwsh
        working-directory: C:\Windows\Temp
        run: |
          $before=(Get-Item "$env:E2E_ROOT\.runtime\python\install-receipt.json").LastWriteTimeUtc
          $pythonBefore=(Get-Item "$env:E2E_ROOT\.runtime\python\python.exe").LastWriteTimeUtc
          $old=$env:HTTPS_PROXY; $env:HTTPS_PROXY='http://127.0.0.1:9'; $env:NO_PROXY=''
          & "$env:E2E_ROOT\start.bat" --no-browser; if ($LASTEXITCODE) { throw 'offline start failed' }
          if ((Get-Item "$env:E2E_ROOT\.runtime\python\install-receipt.json").LastWriteTimeUtc -ne $before) { throw 'runtime downloaded again' }
          if ((Get-Item "$env:E2E_ROOT\.runtime\python\python.exe").LastWriteTimeUtc -ne $pythonBefore) { throw 'runtime was reinstalled' }
          if (Test-Path "$env:E2E_ROOT\.runtime\python-download.part") { throw 'offline start created a download' }
          $repeatHealth=Invoke-RestMethod http://127.0.0.1:8765/__auto_offer_health
          Invoke-WebRequest http://127.0.0.1:8765/ | Out-Null
          & "$env:E2E_ROOT\stop.bat"; if ($LASTEXITCODE) { throw 'offline stop failed' }
          Start-Sleep -Milliseconds 300
          if (Get-Process -Id $repeatHealth.pid -ErrorAction SilentlyContinue) { throw 'repeat server survived stop' }
          if (Test-Path "$env:E2E_ROOT\.runtime\server.json") { throw 'repeat state survived stop' }
          if (Get-ChildItem "$env:E2E_ROOT\.runtime" -Force | Where-Object { $_.Name -eq 'python-download.part' -or $_.Name -like 'python-install-*' }) { throw 'temporary runtime files survived E2E' }
          $env:HTTPS_PROXY=$old
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: ${{ env.RELEASE_NAME }}.zip
          if-no-files-found: error
