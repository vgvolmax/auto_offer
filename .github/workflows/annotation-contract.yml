name: Annotation contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  annotation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check annotation schemas
        run: npm run check:annotation-schemas
      - name: Test annotation contracts
        run: npm run test:annotation
      - name: Test catalog contracts
        run: npm run test:catalog
      - name: Generate annotation schemas
        run: npm run generate:annotation-schemas
      - name: Ensure generated schemas are committed
        run: git diff --exit-code -- schemas/annotation/generated
      - name: Check formatting
        run: git diff --check
