name: Annotation contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  annotation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production taxonomy
        run: npm run taxonomy:validate-production
      - name: Generate annotation schemas
        run: npm run generate:annotation-schemas
      - name: Generate annotation kits
        run: npm run generate:annotation-kits
      - name: Generate autonomous catalog validator
        run: npm run generate:catalog-validation-kit
      - name: Generate offline catalog validator builder
        run: npm run generate:catalog-validation-kit-builder
      - name: Check annotation schemas
        run: npm run check:annotation-schemas
      - name: Check annotation kits
        run: npm run check:annotation-kits
      - name: Check autonomous catalog validator
        run: npm run check:catalog-validation-kit
      - name: Ensure generated contracts are committed
        run: >-
          git diff --exit-code --
          schemas/annotation/class-specific
          schemas/annotation/generated
          schemas/annotation/class-schema-registry.json
          annotation-kits/catalog-annotation-kit.json
          annotation-kits/request-annotation-kit.json
          annotation-kits/annotation-kits-manifest.json
          annotation-kits/catalog-validation-kit.mjs
          tools/catalog-validation-kit-builder.html
