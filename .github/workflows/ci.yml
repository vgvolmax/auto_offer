name: CI full regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Reject disabled or focused tests
        shell: bash
        run: |
          set +e
          matches=$(git grep -n -E '(skip|only)\(' -- scripts/launcher app/src tests)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            printf '%s\n' "$matches"
            echo '::error::Disabled or focused tests are not allowed in repository regression paths.'
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi
      - name: Build browser app
        run: npm run app:build
      - name: Check formatting
        run: git diff --check
